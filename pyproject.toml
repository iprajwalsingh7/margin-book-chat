[project]
name = "margin-book-chat"
version = "0.4.0"
description = "A source-grounded book research workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pypdf==6.21.4",
    "beautifulsoup4==4.15.0",
    "defusedxml==0.7.1",
    "rapidocr==3.10.0",
    "onnxruntime>=1.31.1",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    "fastembed>=0.9.1",
    "google-genai>=2.34.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
